<!doctype html>
<html lang="es">
<head>

  <meta name="theme-color" content="#0A120F">

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; text-align: center;
      background: #0A120F; color: #E8EFE9;
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      padding: 2rem;
      background-image:
        radial-gradient(50rem 30rem at 80% -10%, rgba(92, 203, 156, 0.08), transparent 60%),
        linear-gradient(rgba(92, 203, 156, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 203, 156, 0.05) 1px, transparent 1px);
      background-size: auto, 52px 52px, 52px 52px;
    }
    p { margin: 0 0 1rem; }
    .code {
      font-size: clamp(4.5rem, 20vw, 8rem); font-weight: 600; line-height: 1;
      color: #D9A441; letter-spacing: -0.04em; margin-bottom: 0.4rem;
    }
    .code::after { content: "_"; color: #5CCB9C; animation: blink 1.1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) { .code::after { animation: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 1rem; }
    .sub { color: #9DB0A6; font-size: 0.9rem; max-width: 34rem; margin-inline: auto; }
    .btn {
      display: inline-block; margin-top: 1.6rem; padding: 0.75rem 1.5rem;
      border: 1px solid rgba(217, 164, 65, 0.42); border-radius: 8px;
      color: #D9A441; text-decoration: none;
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .btn:hover { background: rgba(217, 164, 65, 0.12); border-color: #D9A441; }
    :focus-visible { outline: 2px solid #D9A441; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página no encontrada · Page not found</h1>
    <p class="sub">Esta ruta no existe en la placa. — This trace doesn't exist on the board.</p>
    <a class="btn" href="/">← Volver al inicio · Back home</a>
  </main>
</body>
